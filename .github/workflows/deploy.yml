name: Deploy to GitHub Pages

# The repo stays private until launch, and GitHub Pages on a free account
# publishes only from public repositories. So both jobs are skipped (not
# failed) while the repo is private, and the first push after it is made
# public deploys with no edit here. Pages must also be enabled once, with
# Settings -> Pages -> Source set to "GitHub Actions" (see README).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: The release the trust pages describe is published
        # The /trust and /compare pages link to PolicyForge's code at a release tag.
        # Until that tag exists those links 404, so nothing deploys: the pages go live
        # with the release, never before. Every path they link must exist at the tag.
        run: |
          tag=$(sed -n 's/.*releaseTag: "\([^"]*\)".*/\1/p' src/lib/site.ts)
          test -n "$tag" || { echo "no releaseTag in src/lib/site.ts"; exit 1; }
          git clone --quiet --depth 1 --branch "$tag" https://github.com/rdazzleman/policyforge.git "$RUNNER_TEMP/tag"
          python3 scripts/check_trust.py --verify-tree "$RUNNER_TEMP/tag"
      - name: Build
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
