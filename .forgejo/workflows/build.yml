name: Build

# Forgejo runs this file, and ignores .github/workflows/ while this folder
# exists. That keeps the GitHub Pages deploy (.github/workflows/deploy.yml)
# from running here: Pages exists only on the public GitHub mirror, which
# runs .github/workflows/ when Forgejo pushes to it.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Every page built
        run: |
          for p in index how-it-works/index frameworks/index models/index quickstart/index docs/index 404; do
            test -s "dist/$p.html" || { echo "missing dist/$p.html"; exit 1; }
          done
          for f in src/pages/docs/*.md; do
            n=$(basename "$f" .md); [ "$n" = index ] && continue
            test -s "dist/docs/$n/index.html" || { echo "missing dist/docs/$n/index.html"; exit 1; }
          done
          test ! -e dist/consultants/index.html || { echo "dist/consultants exists: the services page is back"; exit 1; }
